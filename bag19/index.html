<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Explorer - Bagian 19 (Event Handling)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 30px auto;
      padding: 0 16px;
      background: #f5f5f5;
    }
    h1 { text-align: center; }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .controls input,
    .controls select {
      padding: 8px;
      font-size: 14px;
      flex: 1;
      min-width: 150px;
    }

    #product-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
    }

    .product-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }
    .product-card img {
      max-width: 100%;
      height: 100px;
      object-fit: contain;
    }
    .product-card h3 { margin: 8px 0 4px; font-size: 16px; }
    .product-card p { margin: 2px 0; font-size: 13px; color: #444; }

    .empty-message {
      text-align: center;
      color: #888;
      grid-column: 1 / -1;
      padding: 30px;
    }
  </style>
</head>
<body>
  <h1>Product Explorer</h1>

  <div class="controls">
    <input type="text" id="search-input" placeholder="Cari produk..." />

    <select id="category-select" aria-label="Filter berdasarkan kategori">
      <option value="all">Semua Kategori</option>
      <option value="laptops">Laptops</option>
      <option value="phones">Phones</option>
      <option value="audio">Audio</option>
    </select>

    <select id="sort-select" aria-label="Urutkan produk">
      <option value="default">Urutkan (default)</option>
      <option value="price-asc">Harga: Rendah ke Tinggi</option>
      <option value="price-desc">Harga: Tinggi ke Rendah</option>
      <option value="rating">Rating Tertinggi</option>
      <option value="title">Judul (A-Z)</option>
    </select>
  </div>

  <div id="product-list"></div>

  <script src="script.js"></script>
</body>
</html>
